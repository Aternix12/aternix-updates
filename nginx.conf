server {
    listen 80 default_server;
    server_name _;

    # These are large binary artefacts — allow up to 1G streamed uploads
    # (though normally files land via ssh+docker cp, not HTTP).
    client_max_body_size 1G;
    charset utf-8;

    # electron-updater's differential downloader sends thousands of
    # byte-ranges in a single Range header (one per changed block in
    # the blockmap). Nginx's default cap is 128; anything past that
    # returns 400, so it falls back to a full 333MB re-download every
    # release. Bump the cap so deltas actually work.
    max_ranges 100000;

    # A Range header for ~5000 blocks is ~75KB. Default nginx header
    # buffers are 8KB × 4 = 32KB max, which produces a 400. Give it
    # room to grow.
    large_client_header_buffers 16 256k;

    location = / {
        default_type text/plain;
        return 200 "aternix-updates\n";
    }

    location = /health {
        default_type application/json;
        return 200 "{\"ok\":true}\n";
    }

    location /updates/ {
        alias /data/;
        autoindex on;
        autoindex_format html;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        types {
            text/yaml         yml yaml;
            application/octet-stream exe blockmap;
        }
        default_type application/octet-stream;
    }
}
