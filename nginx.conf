server {
    listen 80 default_server;
    server_name _;

    # These are large binary artefacts — allow up to 1G streamed uploads
    # (though normally files land via ssh+docker cp, not HTTP).
    client_max_body_size 1G;
    charset utf-8;

    location = / {
        default_type text/plain;
        return 200 "aternix-updates\n";
    }

    location = /health {
        default_type application/json;
        return 200 "{\"ok\":true}\n";
    }

    location /updates/ {
        alias /data/;
        autoindex on;
        autoindex_format html;
        add_header Cache-Control "public, max-age=300";
        add_header X-Content-Type-Options "nosniff";
        types {
            text/yaml         yml yaml;
            application/octet-stream exe blockmap;
        }
        default_type application/octet-stream;
    }
}
